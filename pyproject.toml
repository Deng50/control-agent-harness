[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-agent-harness"
version = "0.1.0"
description = "Control engineering domain plugins and numerical workers for DeepSeek Harness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1", "openpyxl==3.1.5", "threadpoolctl==3.7.0"]

[project.optional-dependencies]
presentation = ["matplotlib>=3.8", "pymupdf>=1.24"]

[project.scripts]
control-worker = "control_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_harness = ["stage_contracts.json"]
